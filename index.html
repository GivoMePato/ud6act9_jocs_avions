<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Abel Gonzalez" />
    <title>Red Plane</title>
    <script src="js/scripts.js"></script>
    <link rel="stylesheet" href="css/estils.css" />

</head>

<body onload="docReady()">

    <header>

    </header>
    <main>
        <!-- avió -->
        <div id="avio"></div>
        <div id="footer">

                </div>
                <p><i class="fa-solid fa-arrow-left"></i> Esquerra</p>
